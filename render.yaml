# Render Blueprint: one-click deploy of the full stack.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: prana
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      # Render chain: <client>, <Cloudflare edge>, <Render LB> -> client is 3rd from the right
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: prana-db
          property: connectionString

databases:
  - name: prana-db
    plan: free
    databaseName: prana
    user: prana
    ipAllowList: [] # private network only
